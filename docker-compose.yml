services:
  mongo:
    image: mongo:7
    container_name: dialer-mongo
    ports: ["27017:27017"]
    volumes: [dialer-mongo-data:/data/db]
  redis:
    image: redis:7
    container_name: dialer-redis
    # notify-keyspace-events Ex => key-expiry events, used to drive the wrap-up countdown
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports: ["6379:6379"]
volumes:
  dialer-mongo-data:
